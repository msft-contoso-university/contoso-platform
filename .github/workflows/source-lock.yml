name: Locked sources

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate source materialization
        shell: pwsh
        run: ./tests/test-materialize-sources.ps1
      - name: Install pinned azd for native hook spike
        run: |
          mkdir -p "$RUNNER_TEMP/azd-1.38.0"
          curl --fail --silent --show-error --location \
            https://github.com/Azure/azure-dev/releases/download/azure-dev-cli_1.38.0/azd-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/azd-1.38.0/azd.tar.gz"
          echo 'a975ff5f74bead27dad97ea4d7396d4802a0cb573a908b643af1f47a8f13d98c  '"$RUNNER_TEMP/azd-1.38.0/azd.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/azd-1.38.0/azd.tar.gz" -C "$RUNNER_TEMP/azd-1.38.0"
          install -m 755 "$RUNNER_TEMP/azd-1.38.0/azd-linux-amd64" "$RUNNER_TEMP/azd-1.38.0/azd"
          echo "$RUNNER_TEMP/azd-1.38.0" >> "$GITHUB_PATH"
      - name: Test lifecycle safeguards and infrastructure helpers
        env:
          ADLC_REQUIRE_AZD_SPIKE: '1'
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test private SQL grant orchestration
        shell: pwsh
        run: ./tests/test-invoke-private-sql-grants.ps1
      - name: Test native azd action binding
        shell: pwsh
        run: ./tests/test-azd-action.ps1
      - name: Install pinned Bicep
        run: az bicep install --version v0.41.2
      - name: Verify compiled private API security properties
        shell: pwsh
        run: ./tests/test-private-api-template.ps1
      - name: Verify compiled Web hosting security properties
        shell: pwsh
        run: ./tests/test-web-template.ps1
      - name: Verify azd parameter bindings
        shell: pwsh
        run: ./tests/test-main-parameters.ps1
      - name: Verify Container Apps template safeguards
        shell: pwsh
        run: ./tests/test-container-templates.ps1
      - name: Compile private endpoint probe
        run: |
          az bicep build --file infra/modules/private-probe.bicep --stdout > /dev/null
          az bicep build --file infra/modules/sql-grants.bicep --stdout > /dev/null
          az bicep build --file infra/modules/service-databases.bicep --stdout > /dev/null
          az bicep build --file infra/modules/environment-databases.bicep --stdout > /dev/null
          az bicep build --file infra/modules/private-execution-storage.bicep --stdout > /dev/null
          az bicep build --file infra/modules/shared-network.bicep --stdout > /dev/null
          az bicep build --file infra/modules/shared-observability-registry.bicep --stdout > /dev/null
          az bicep build --file infra/modules/shared-foundation.bicep --stdout > /dev/null
          az bicep build --file infra/modules/private-api-hosting.bicep --stdout > /dev/null
          az bicep build --file infra/modules/enrollments-hosting.bicep --stdout > /dev/null
          az bicep build --file infra/modules/enrollments-app.bicep --stdout > /dev/null
          az bicep build --file infra/main.bicep --stdout > /dev/null
